<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giant atmosphere validation</title>
<style>body{background:#101319;color:#e2e8f0;font:14px system-ui;margin:24px}button,select,input{padding:8px;margin:4px}canvas{max-width:100%;height:auto}pre{white-space:pre-wrap}.gallery{display:flex;gap:12px;flex-wrap:wrap}.gallery img{width:300px;height:225px}.gallery p{font-size:12px}h1{font-size:22px}</style>
